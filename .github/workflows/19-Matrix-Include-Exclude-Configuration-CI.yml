
# GitHub Actions: Matrix Include and Exclude Configuration

name: "🧩 [Workflow-19] Matrix Include and Exclude Configuration"

run-name: "🧩 [Workflow-19] ${{ github.actor }} → Customizing Matrix Configurations"

env:
  WORKING_DIRECTORY: "19-Matrix-Include-Exclude-Configuration-CI-Workflow"

on:
  push:
    branches:
      - develop
      - master
    paths:
      - '19-Matrix-Include-Exclude-Configuration-CI-Workflow/**'
      - '.github/workflows/19-Matrix-Include-Exclude-Configuration-CI.yml'

jobs:
  test-job:
    name: "Node.js Test Job"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
        environment: ['development', 'production']
        exclude:
          - node-version: '20'
        include:
          - node-version: '22'
            environment: 'development'
          - node-version: '24'
            environment: 'production'

    env:
      NODE_VERSION: ${{ matrix.node-version }}
      ENVIRONMENT: ${{ matrix.environment }}

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Display Matrix Configuration
        run: echo "Running Node.js $NODE_VERSION in $ENVIRONMENT"

      - name: Install Node.js Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install

      - name: Run Node.js Test Suite
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run test
