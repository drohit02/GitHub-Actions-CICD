# GitHub Actions: Workflow Concurrency Control

name: "🔄 [Workflow-20] Workflow Concurrency Control"

run-name: "🔄 [Workflow-20] ${{ github.actor }} → Managing Concurrent Workflow Runs"

env : 
  PYTHON_VERSION : '3.13'
  WORKING_DIRECTORY : '20-Workflow-Concurrency-Control-CI-Workflow'
  ENVIRONMENT : 'Production'

concurrency : 
  group : ${{ github.workflow }}-${{ github.ref}}
  cancel-in-progress : true

on : 
  push :
    branches : 
      - 'develop'
      - 'master'
    paths : 
      - '.github/workflows/20-Workflow-Concurrency-Control-CI.yml'
      - '20-Workflow-Concurrency-Control-CI-Workflow/**'

jobs : 
  test-job:

    name : Python App Test Suite job

    runs-on : ubuntu-latest

    steps : 

      - name :  Checkout the Code
        uses : actions/checkout@v4

      - name : Set-Up Python Environment
        uses : actions/setup-python@v5
        with :
          python-version : ${{ env.PYTHON_VERSION }}
      
      - name : Install Dependencies
        working-directory : ${{ env.WORKING_DIRECTORY }}
        run :  python3 -m pip install -r requirements.txt

      - name : Run the Test cases
        working-directory : ${{ env.WORKING_DIRECTORY }}
        run : python3 -m pytest -v

      - name : Run the Python App
        if : ${{ success() }}
        run : python3 app.py


