# GitHub Actions: Dependency Cache Configuration

name: "⚡ [Workflow-17] Dependency Cache Configuration"

run-name: "⚡ [Workflow-17] ${{ github.actor }} → Running CI with Dependency Cache"

env : 
  NODE_DEPENDENCY_CACHE_IDENTIFIER : 'MyNodeAppDependecy'
  NODE_DEPENDENCY_CACHE_NAME : "AppDependecy"

on : 
  push : 
    branches : [develop,master]
    paths :
      - '.github/workflows/17-Dependency-Cache-Configuration-CI.yml'
      - '17-Dependency-Cache-Configuration-CI-Workflow/**'

jobs:
  build-job:
    name : Node JS App Build App

    runs-on :  ubuntu-latest

    steps : 

      - name : Checkcout the Code
        uses : actions/checkout@v4
      
      - name : Cache the Node Js Dependency
        id : ${{env.NODE_DEPENDENCY_CACHE_IDENTIFIER}}
        uses : actions/cache@v4
        with : 
          path : ~/.npm
          key : ${{runner.os}}-${{env.NODE_DEPENDENCY_CACHE_NAME}}-${{hashFiles{**/package-lock.json}}}

      - name : List the Node Modules Dependency
        run : cd 17-Dependency-Cache-Configuration-CI-Workflow && npm List

      - name : Install the Dependency
        run  : cd 17-Dependency-Cache-Configuration-CI-Workflow && npm Install

      - name : Run Node JS App Build
        run :  cd 17-Dependency-Cache-Configuration-CI-Workflow && npm run build

      - name : Run Node Js App Deploy
        run : cd 17-Dependency-Cache-Configuration-CI-Workflow && npm run deploy

      
