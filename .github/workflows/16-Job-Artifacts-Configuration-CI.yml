# GitHub Actions: Job Artifacts Configuration

name: "📦 [Workflow-16] Job Artifacts Configuration"

run-name: "📦 [Workflow-16] ${{ github.actor }} → Sharing Build Artifacts Between Jobs"

env:
  APP_ARTIFACT_NAME: "Node-JS App Build File"

on:
  push:
    branches:
      - develop
      - master
    paths:
      - '.github/workflows/16-Job-Artifacts-Configuration-CI.yml'
      - '16-Job-Artifacts-Configuration-CI-Workflow/**'

jobs:
  upload-artifact-job:
    name: Node-Js Upload Artifacts Job

    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '24'

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6

      - name: Setup Node JS Environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependency and Build
        working-directory: 16-Job-Artifacts-Configuration-CI-Workflow
        run: |
          echo "Running the Node JS App Before the Upload Artifacts Upload !!!"
          npm install
          npm run build

      - name: Upload App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}
          path: |
            16-Job-Artifacts-Configuration-CI-Workflow/package.json
            16-Job-Artifacts-Configuration-CI-Workflow/build.js

  download-artifact-job:
    name: Node Js Download Artifacts Job

    runs-on: ubuntu-latest

    needs: upload-artifact-job

    env:
      NODE_VERSION: '24'

    steps:
      - name: Download App Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}
          path: deployment-artifact

      - name: Display Downloaded Artifacts
        run: |
          echo "Downloaded Application Artifacts:"
          ls -la deployment-artifact

      - name: Setup the Node JS Environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        working-directory: deployment-artifact
        run: npm install

      - name: Run the Downloaded Artifact
        working-directory: deployment-artifact
        run: npm run build